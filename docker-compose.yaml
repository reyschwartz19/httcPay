
services:
 db:
  image: postgres:15
  ports:
   - 5433:5432
  environment:
    POSTGRES_USER: username123
    POSTGRES_PASSWORD: password123
    POSTGRES_DB: mydb123
  volumes:
    - data:/var/lib/postgresql/data
  restart: unless-stopped
 adminer:
  image: adminer:latest
  restart: unless-stopped
  ports:
   - 8080:8080
  depends_on:
   - db   

 studpaybackend:
  build: ./backend
  container_name: studpaybackend
  ports:
   - 3001:3001
  env_file:
   - ./backend/.env
  restart:
    unless-stopped
  depends_on:
   - db

 nginxstudpay:
  image: nginx:alpine
  ports:
    - 81:80
    - 444:443
  volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./certs:/etc/nginx/certs:ro
  depends_on:
    - studpaybackend
    - studpayfrontend

 studpayfrontend:
  build: ./frontend
  container_name: studpayfrontend
  ports:
   - 5173:5173
  env_file:
   - ./frontend/.env
  restart:
    unless-stopped
  depends_on:
   - studpaybackend

volumes:
  data:
    